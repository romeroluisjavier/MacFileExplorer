name: Deploy MacFileExplorer GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "GithubPages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Only allow the repository owner on `main` to publish updates to the website
    if: github.ref == 'refs/heads/main' && github.actor == 'romeroluisjavier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GithubPages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "GithubPages"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
